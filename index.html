<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bare Label</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #f4f3ee;
  --card: #ffffff;
  --card-shadow: 0 1px 3px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.03);
  --card-shadow-lg: 0 2px 8px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.05);
  --text: #2c2c2c;
  --text-secondary: #6b6b6b;
  --text-light: #9a9a9a;
  --border: #e8e6e0;
  --sage: #7a9a7e;
  --sage-light: #e8f0e9;
  --sage-bg: #f0f5f1;
  --rose: #c4877a;
  --rose-light: #f5ebe8;
  --rose-bg: #faf3f1;
  --amber: #c49a6c;
  --amber-light: #f5ede3;
  --green-pill: #e8f0e9;
  --green-pill-text: #4a7a50;
  --amber-pill: #f5ede3;
  --amber-pill-text: #8a6a3a;
  --serif: 'Lora', Georgia, 'Times New Roman', serif;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --radius: 12px;
  --radius-sm: 10px;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
}

html { font-size: 16px; -webkit-font-smoothing: antialiased; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
  overflow-x: hidden;
}

/* ── App Shell ── */
.app {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 24px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── Header ── */
.header {
  text-align: center;
  padding: 56px 0 0;
  transition: padding 0.4s var(--ease);
}
.app.has-selection .header {
  padding: 32px 0 0;
}
.header h1 {
  font-family: var(--serif);
  font-size: 2.6rem;
  font-weight: 400;
  letter-spacing: -0.02em;
  color: var(--text);
  margin-bottom: 6px;
  transition: font-size 0.4s var(--ease);
}
.app.has-selection .header h1 {
  font-size: 1.8rem;
}
.header .subtitle {
  font-size: 0.92rem;
  color: var(--text-secondary);
  font-weight: 400;
  margin-bottom: 28px;
  transition: all 0.4s var(--ease);
}
.app.has-selection .header .subtitle {
  font-size: 0.85rem;
  margin-bottom: 20px;
}

/* ── Tabs ── */
.tabs {
  display: flex;
  justify-content: center;
  gap: 24px;
  margin-bottom: 20px;
}
.tab {
  font-family: var(--sans);
  font-size: 0.85rem;
  font-weight: 500;
  border: none;
  background: transparent;
  color: var(--text-light);
  cursor: pointer;
  padding: 6px 16px;
  border-radius: 20px;
  transition: all 0.25s var(--ease);
  letter-spacing: 0.01em;
}
.tab:hover { color: var(--text-secondary); }
.tab.active {
  color: var(--text);
  background: rgba(0,0,0,0.04);
}
.tab.active[data-tab="ingredients"] {
  color: var(--sage);
  background: var(--sage-light);
}
.tab.active[data-tab="concerns"] {
  color: var(--rose);
  background: var(--rose-light);
}

/* ── Content Area ── */
.content-area {
  flex: 1;
  display: flex;
  justify-content: center;
  gap: 24px;
  padding-bottom: 60px;
  transition: all 0.4s var(--ease);
}

/* ── List Panel ── */
.list-panel {
  width: 100%;
  max-width: 560px;
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--card-shadow);
  overflow: hidden;
  transition: all 0.4s var(--ease);
  flex-shrink: 0;
}
.app.has-selection .list-panel {
  max-width: 380px;
  min-width: 340px;
}

/* ── Search ── */
.search-box {
  position: relative;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}
.search-box svg {
  position: absolute;
  left: 28px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-light);
  width: 16px;
  height: 16px;
  transition: color 0.25s var(--ease);
}
.search-box input {
  width: 100%;
  padding: 8px 12px 8px 32px;
  font-family: var(--sans);
  font-size: 0.9rem;
  border: none;
  background: transparent;
  color: var(--text);
  outline: none;
}
.search-box input::placeholder { color: var(--text-light); }
.search-box:has(input:focus) svg { color: var(--sage); }

/* ── List ── */
.list-scroll {
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  max-height: 400px;
  scroll-behavior: smooth;
}
.app.has-selection .list-scroll {
  max-height: calc(100vh - 260px);
}
.list-scroll::-webkit-scrollbar { width: 3px; }
.list-scroll::-webkit-scrollbar-track { background: transparent; }
.list-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.list-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 18px;
  cursor: pointer;
  border-bottom: 1px solid rgba(0,0,0,0.04);
  transition: background 0.15s var(--ease);
}
.list-item:last-child {
  border-bottom: none;
}
.list-item:hover {
  background: rgba(0,0,0,0.025);
}
.list-item.active {
  background: #f0efeb;
}
.list-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
  background: var(--sage);
  opacity: 0.6;
}
.list-dot.concern { background: var(--rose); }
.list-item.active .list-dot { opacity: 1; }
.list-info { flex: 1; min-width: 0; }
.list-name {
  font-family: var(--sans);
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.3;
}
.list-sub {
  font-size: 0.78rem;
  color: var(--text-light);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.3;
  margin-top: 1px;
}
.list-item.active .list-name { color: var(--text); }

.no-results {
  padding: 48px 20px;
  text-align: center;
  color: var(--text-light);
  font-size: 0.88rem;
  line-height: 1.7;
}

/* ── Detail Panel ── */
.detail-panel {
  flex: 1;
  max-width: 620px;
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--card-shadow);
  padding: 36px;
  overflow-y: auto;
  max-height: calc(100vh - 200px);
  opacity: 0;
  transform: translateX(30px);
  pointer-events: none;
  position: absolute;
  right: -9999px;
  transition: opacity 0.4s var(--ease), transform 0.4s var(--ease);
}
.detail-panel::-webkit-scrollbar { width: 3px; }
.detail-panel::-webkit-scrollbar-track { background: transparent; }
.detail-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.app.has-selection .detail-panel {
  opacity: 1;
  transform: translateX(0);
  pointer-events: auto;
  position: static;
  right: auto;
}

.back-btn {
  display: none;
  align-items: center;
  gap: 6px;
  font-family: var(--sans);
  font-size: 0.84rem;
  color: var(--text-secondary);
  background: none;
  border: none;
  cursor: pointer;
  margin-bottom: 20px;
  padding: 4px 0;
  transition: color 0.2s var(--ease);
}
.back-btn:hover { color: var(--text); }
.back-btn svg { width: 16px; height: 16px; }
.app.has-selection .back-btn { display: inline-flex; }

.detail-header {
  margin-bottom: 24px;
}
.detail-title {
  font-family: var(--serif);
  font-size: 1.8rem;
  font-weight: 500;
  margin-bottom: 4px;
  letter-spacing: -0.01em;
  color: var(--text);
}
.detail-aka {
  font-family: var(--serif);
  font-style: italic;
  font-size: 0.9rem;
  color: var(--text-secondary);
}

/* ── Ingredient detail ── */
.info-grid {
  display: grid;
  grid-template-columns: 130px 1fr;
  gap: 0;
  margin-bottom: 24px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  overflow: hidden;
}
.info-row { display: contents; }
.info-label {
  padding: 9px 12px;
  font-size: 0.78rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-secondary);
  background: var(--sage-bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
}
.info-value {
  padding: 9px 12px;
  font-size: 0.87rem;
  color: var(--text);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 5px;
}
.info-row:last-child .info-label,
.info-row:last-child .info-value { border-bottom: none; }

.conflict-tag {
  display: inline-block;
  padding: 2px 9px;
  font-size: 0.76rem;
  font-weight: 500;
  background: var(--amber-pill);
  color: var(--amber-pill-text);
  border-radius: 20px;
}

.section-title {
  font-family: var(--serif);
  font-size: 1.05rem;
  font-weight: 600;
  margin: 24px 0 10px;
  color: var(--text);
}

.product-rec {
  background: var(--sage-bg);
  border-radius: var(--radius-sm);
  padding: 14px;
  margin-bottom: 6px;
}
.product-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.product-details {
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  transition: max-height 0.35s var(--ease), opacity 0.25s var(--ease), margin 0.35s var(--ease);
  margin-top: 0;
}
.product-rec.expanded .product-details {
  max-height: 200px;
  opacity: 1;
  margin-top: 10px;
}
.info-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text-light);
  padding: 4px;
  border-radius: 50%;
  transition: color 0.2s, background 0.2s, transform 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.info-btn:hover {
  color: var(--sage);
  background: var(--sage-light);
}
.info-btn.small {
  padding: 2px;
}
/* Routine step expand */
.routine-step .step-top {
  display: flex;
  align-items: center;
  gap: 8px;
}
.routine-step .step-top .step-name {
  flex: 1;
}
.routine-step .step-details {
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  transition: max-height 0.35s var(--ease), opacity 0.25s var(--ease), margin 0.35s var(--ease);
  margin-top: 0;
}
.routine-step.expanded .step-details {
  max-height: 200px;
  opacity: 1;
  margin-top: 8px;
}
.product-name {
  font-weight: 600;
  font-size: 0.88rem;
  margin-bottom: 4px;
}
.product-review {
  font-size: 0.8rem;
  color: var(--sage);
  font-weight: 500;
  margin-bottom: 5px;
  line-height: 1.4;
}
.product-note {
  font-size: 0.8rem;
  color: var(--text-secondary);
  line-height: 1.5;
}

.pills {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 6px;
}
.pill {
  display: inline-block;
  padding: 3px 11px;
  font-size: 0.76rem;
  font-weight: 500;
  border-radius: 20px;
}
.pill.pro { background: var(--green-pill); color: var(--green-pill-text); }
.pill.con { background: var(--amber-pill); color: var(--amber-pill-text); }

/* ── Concern detail ── */
.concern-desc {
  font-size: 0.92rem;
  line-height: 1.7;
  color: var(--text);
  margin-bottom: 24px;
}

.routine-container {
  position: relative;
  padding-left: 18px;
}
.routine-container::before {
  content: '';
  position: absolute;
  left: 10px;
  top: 22px;
  bottom: 22px;
  width: 2px;
  background: linear-gradient(to bottom, var(--rose-light), var(--rose), var(--rose-light));
  border-radius: 2px;
}
.routine-step {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px 14px 14px 48px;
  margin-bottom: 8px;
  margin-left: 22px;
  position: relative;
}
.routine-step::before {
  content: '';
  position: absolute;
  left: -31px;
  top: 20px;
  width: 16px;
  height: 2px;
  background: var(--rose-light);
}
.step-number {
  position: absolute;
  left: 14px;
  top: 14px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--rose-light);
  color: var(--rose);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
  font-weight: 600;
}
.step-name {
  font-weight: 600;
  font-size: 0.88rem;
  margin-bottom: 3px;
}
.step-why {
  font-size: 0.82rem;
  color: var(--text-secondary);
  margin-bottom: 5px;
}
.step-product {
  font-size: 0.8rem;
  color: var(--sage);
  font-weight: 500;
}
.step-lookfor {
  font-size: 0.76rem;
  color: var(--text-light);
  font-style: italic;
  margin-top: 2px;
}
.step-freq {
  display: inline-block;
  font-size: 0.7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--rose);
  background: var(--rose-light);
  padding: 2px 7px;
  border-radius: 4px;
  margin-top: 5px;
}

/* ── Timeline ── */
.timeline {
  background: var(--rose-bg);
  border-radius: var(--radius-sm);
  padding: 18px;
  margin: 18px 0;
}
.timeline.ingredient-timeline { background: var(--sage-bg); }
.timeline-title {
  font-family: var(--serif);
  font-weight: 600;
  font-size: 0.92rem;
  margin-bottom: 12px;
  color: var(--text);
}
.timeline-rows {
  position: relative;
  padding-left: 16px;
}
.timeline-rows::before {
  content: '';
  position: absolute;
  left: 4px;
  top: 8px;
  bottom: 8px;
  width: 2px;
  background: var(--rose);
  border-radius: 2px;
  opacity: 0.3;
}
.timeline.ingredient-timeline .timeline-rows::before { background: var(--sage); }
.timeline-row {
  display: flex;
  gap: 12px;
  margin-bottom: 10px;
  font-size: 0.83rem;
  align-items: baseline;
  position: relative;
}
.timeline-row:last-child { margin-bottom: 0; }
.timeline-row::before {
  content: '';
  position: absolute;
  left: -16px;
  top: 6px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--rose);
}
.timeline.ingredient-timeline .timeline-row::before { background: var(--sage); }
.timeline-period {
  font-weight: 600;
  color: var(--rose);
  min-width: 76px;
  flex-shrink: 0;
}
.timeline.ingredient-timeline .timeline-period { color: var(--sage); }
.timeline-desc { color: var(--text-secondary); }

.closing-note {
  font-family: var(--serif);
  font-style: italic;
  font-size: 0.92rem;
  color: var(--text-secondary);
  margin-top: 20px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
  line-height: 1.7;
}

.derm-note {
  background: var(--amber-light);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  font-size: 0.82rem;
  color: var(--amber-pill-text);
  margin-top: 14px;
  line-height: 1.6;
}
.derm-note strong { font-weight: 600; }

/* ── Mobile ── */
@media (max-width: 768px) {
  .app { padding: 0 16px; }
  .header { padding: 36px 0 0; }
  .header h1 { font-size: 2rem; }
  .app.has-selection .header h1 { font-size: 2rem; }
  .header .subtitle { font-size: 0.85rem; margin-bottom: 20px; }

  .content-area {
    flex-direction: column;
    gap: 0;
  }

  .list-panel {
    max-width: 100%;
  }
  .app.has-selection .list-panel {
    max-width: 100%;
    min-width: unset;
  }
  .list-scroll {
    max-height: 50vh;
  }

  /* Mobile: hide list when detail is shown */
  .app.has-selection .header { display: none; }
  .app.has-selection .list-panel { display: none; }
  .app.has-selection .detail-panel {
    max-height: none;
    padding: 24px 18px;
  }

  .back-btn { display: none; }
  .app.has-selection .back-btn { display: inline-flex; }

  .info-grid { grid-template-columns: 110px 1fr; }
  .routine-container { padding-left: 12px; }
  .routine-step { margin-left: 16px; padding-left: 44px; }
  .routine-step::before { left: -25px; width: 10px; }
}

/* ── Content transition on detail show ── */
.detail-content {
  animation: detailFadeIn 0.35s var(--ease) forwards;
}
@keyframes detailFadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div class="app" id="app">
  <div class="header">
    <h1>Bare Label</h1>
    <p class="subtitle">Skincare advice you can actually trust.</p>
    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="ingredients" onclick="switchTab('ingredients')">Ingredients</button>
      <button class="tab" data-tab="concerns" onclick="switchTab('concerns')">Skin Concerns</button>
    </div>
  </div>

  <div class="content-area">
    <div class="list-panel" id="listPanel">
      <div class="search-box">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/></svg>
        <input type="text" id="searchInput" placeholder="Search..." oninput="filterList()">
      </div>
      <div class="list-scroll" id="listScroll"></div>
    </div>
    <div class="detail-panel" id="detailPanel"></div>
  </div>
</div>

<script>

  {

    bodyPct: "5\u201310%",
    howOften: "Twice daily, AM and PM",
    dontMix: ["Pure Vitamin C at high concentrations (can cause flushing in some people)"],
    product: "The Ordinary Niacinamide 10% + Zinc 1%",
    productReview: "50,000+ reviews, 4.3 stars. One of the best-selling serums globally. Visible pore reduction in 4\u20136 weeks per most users.",
    productNote: "Look for: 5% is effective and less likely to irritate than 10%. Zinc helps with oil control.",
    pros: ["Plays well with most ingredients", "Reduces pore appearance", "Strengthens skin barrier", "Calms redness"],
    cons: ["10% can cause breakouts in some", "Tingling at high concentrations", "Pill-ing under makeup if layered heavily"],
    expect: [
      { period: "Week 1\u20132", desc: "Skin may feel slightly smoother. Oil production might balance a bit." },
      { period: "Week 4\u20136", desc: "Pores look smaller. Redness and uneven tone start improving." },
      { period: "Week 8+", desc: "Visible brightening. Skin barrier feels stronger and more resilient." }
    ]
  },
  {
    name: "Glycolic Acid",
    aka: "AHA, Alpha Hydroxy Acid (from sugarcane)",
    sub: "AHA that exfoliates the surface for glow",

let activeTab = 'ingredients';
let activeIndex = null;

function switchTab(tab) {
  activeTab = tab;
  deselectItem();
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === tab);
  });
  document.getElementById('searchInput').value = '';
  renderList();
}

function filterList() {
  renderList();
}

function renderList() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const scroll = document.getElementById('listScroll');
  const data = activeTab === 'ingredients' ? ingredients : concerns;
  const filtered = data.filter(item =>
    item.name.toLowerCase().includes(q) ||
    item.sub.toLowerCase().includes(q) ||
    (item.aka && item.aka.toLowerCase().includes(q))
  );

  if (filtered.length === 0) {
    scroll.innerHTML = '<div class="no-results">No results found. Try a different search.</div>';
    return;
  }

  scroll.innerHTML = filtered.map(item => {
    const realIndex = data.indexOf(item);
    const isActive = activeIndex === realIndex;
    const isConcern = activeTab === 'concerns';
    return `
      <div class="list-item ${isActive ? 'active' : ''}" onclick="selectItem(${realIndex})">
        <div class="list-dot ${isConcern ? 'concern' : ''}"></div>
        <div class="list-info">
          <div class="list-name">${item.name}</div>
          <div class="list-sub">${item.sub}</div>
        </div>
      </div>
    `;
  }).join('');
}

function selectItem(index) {
  activeIndex = index;
  document.getElementById('app').classList.add('has-selection');
  renderList();
  if (activeTab === 'ingredients') {
    renderIngredient(ingredients[index]);
  } else {
    renderConcern(concerns[index]);
  }
  // On mobile, scroll detail into view
  if (window.innerWidth <= 768) {
    setTimeout(() => {
      document.getElementById('detailPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 50);
  }
}

function deselectItem() {
  activeIndex = null;
  document.getElementById('app').classList.remove('has-selection');
  document.getElementById('detailPanel').innerHTML = '';
  renderList();
}

function goBack() {
  deselectItem();
}

function renderIngredient(item) {
  const conflicts = item.dontMix.map(c => `<span class="conflict-tag">${c}</span>`).join('');
  const pros = item.pros.map(p => `<span class="pill pro">${p}</span>`).join('');
  const cons = item.cons.map(c => `<span class="pill con">${c}</span>`).join('');

  document.getElementById('detailPanel').innerHTML = `
    <div class="detail-content">
      <button class="back-btn" onclick="goBack()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5"/></svg>
        Back
      </button>
      <div class="detail-header">
        <h2 class="detail-title">${item.name}</h2>
        <p class="detail-aka">${item.aka}</p>
      </div>

      <div class="info-grid">
        <div class="info-row"><div class="info-label">Type</div><div class="info-value">${item.type}</div></div>
        <div class="info-row"><div class="info-label">Best for</div><div class="info-value">${item.bestFor}</div></div>
        <div class="info-row"><div class="info-label">Face %</div><div class="info-value">${item.facePct}</div></div>
        <div class="info-row"><div class="info-label">Body %</div><div class="info-value">${item.bodyPct}</div></div>
        <div class="info-row"><div class="info-label">How often</div><div class="info-value">${item.howOften}</div></div>
        <div class="info-row"><div class="info-label">Don\u2019t mix</div><div class="info-value">${conflicts}</div></div>
      </div>

      <h3 class="section-title">Best reviewed product</h3>
      <div class="product-rec">
        <div class="product-header">
          <div class="product-name">${item.product}</div>
          <button class="info-btn" onclick="this.closest('.product-rec').classList.toggle('expanded')" title="More info">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" width="18" height="18"><circle cx="12" cy="12" r="10"/><path stroke-linecap="round" d="M12 16v-4m0-3.5v-.01"/></svg>
          </button>
        </div>
        <div class="product-details">
          ${item.productReview ? `<div class="product-review">${item.productReview}</div>` : ''}
          <div class="product-note">${item.productNote}</div>
        </div>
      </div>

      <h3 class="section-title">Pros</h3>
      <div class="pills">${pros}</div>

      <h3 class="section-title" style="margin-top:18px;">Cons</h3>
      <div class="pills">${cons}</div>

      ${item.expect ? `
      <div class="timeline ingredient-timeline" style="margin-top:20px;">
        <div class="timeline-title">What to expect</div>
        <div class="timeline-rows">
          ${item.expect.map(t => `
            <div class="timeline-row">
              <span class="timeline-period">${t.period}</span>
              <span class="timeline-desc">${t.desc}</span>
            </div>
          `).join('')}
        </div>
      </div>
      ` : ''}
    </div>
  `;
}

function renderConcern(item) {
  const steps = item.routine.map((s, i) => `
    <div class="routine-step">
      <div class="step-top">
        <div class="step-number">${i + 1}</div>
        <div class="step-name">${s.step}</div>
        <button class="info-btn small" onclick="this.closest('.routine-step').classList.toggle('expanded')" title="More info">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" width="16" height="16"><circle cx="12" cy="12" r="10"/><path stroke-linecap="round" d="M12 16v-4m0-3.5v-.01"/></svg>
        </button>
      </div>
      <div class="step-why">${s.why}</div>
      <div class="step-details">
        <div class="step-product">${s.product}</div>
        <div class="step-lookfor">${s.lookFor}</div>
        <span class="step-freq">${s.freq}</span>
      </div>
    </div>
  `).join('');

  const tl = item.timeline.map(t => `
    <div class="timeline-row">
      <span class="timeline-period">${t.period}</span>
      <span class="timeline-desc">${t.desc}</span>
    </div>
  `).join('');

  const derm = item.dermNote
    ? `<div class="derm-note"><strong>Worth seeing a dermatologist?</strong> ${item.dermNote}</div>`
    : '';

  document.getElementById('detailPanel').innerHTML = `
    <div class="detail-content">
      <button class="back-btn" onclick="goBack()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5"/></svg>
        Back
      </button>
      <div class="detail-header">
        <h2 class="detail-title">${item.name}</h2>
        <p class="detail-aka">${item.aka}</p>
      </div>
      <p class="concern-desc">${item.desc}</p>

      <h3 class="section-title">Your Routine</h3>
      <div class="routine-container">
        ${steps}
      </div>

      <div class="timeline">
        <div class="timeline-title">What to expect</div>
        <div class="timeline-rows">
          ${tl}
        </div>
      </div>

      <p class="closing-note">${item.closing}</p>
      ${derm}
    </div>
  `;
}

// Init
renderList();
</script>
